name: Deploy public demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout scheme one
        uses: actions/checkout@v4
        with:
          ref: scheme-1
          path: scheme-1-source
      - name: Assemble published versions
        run: |
          mkdir -p site/scheme-1
          cp -R dist/client/. site/
          cp -R scheme-1-source/dist/client/. site/scheme-1/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
